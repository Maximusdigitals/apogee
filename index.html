<body>
<canvas id="gl" aria-label="The solar system in 3D. Use the arrows to travel between planets, drag to spin the object you are looking at, tap a planet for its story."></canvas>
<div id="vig" aria-hidden="true"></div>
<div id="frame" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><b class="reticle"></b></div>
<div id="labels"></div>

<header id="hud">
  <div class="brand"><b>Apogee</b><span>Solar system survey</span></div>
  <div class="hud-r">
    <div id="tele" aria-live="polite"></div>
    <button id="snd" type="button" aria-label="Sound on or off"><span class="eq"><i></i><i></i><i></i><i></i></span><span class="lbl">Sound</span></button>
  </div>
</header>

<nav id="rail" aria-label="Destinations">
  <button id="prev" type="button" aria-label="Previous destination"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ticks"></div>
  <button id="next" type="button" aria-label="Next destination"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>
<button id="sPrev" class="snav l" type="button" aria-label="Previous destination"><i><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></i><span></span></button>
<button id="sNext" class="snav r" type="button" aria-label="Next destination"><i><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></i><span></span></button>
<p id="hint" aria-live="polite"></p>

<aside id="card" aria-live="polite"><button id="cardX" type="button" aria-label="Close">×</button><div id="cardIn"></div></aside>
<div id="pop" role="dialog"></div>

<div id="earthUI"><button id="earthBack" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back to orbit</button></div>
<div id="hyperUI"><button id="hyperBack" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Return to orbit</button></div>
<div id="fade" aria-hidden="true"></div>
<i id="ripple" aria-hidden="true"></i>

<div id="loader">
  <div class="ld-mid">
    <p class="ld-k">A journey through the solar system</p>
    <h1>Apogee</h1>
    <div class="ld-load"><div class="ld-bar"><i id="ldBar"></i></div><p class="ld-pct"><span id="ldPct">000</span>Loading imagery</p></div>
    <div class="ld-go">
      <button id="go" class="btn" type="button"><span>Begin descent</span><i></i></button>
      <button id="goQuiet" class="lnk" type="button">Enter without sound</button>
    </div>
  </div>
  <p class="ld-foot">Drag to spin · Arrows to travel · Tap a planet</p>
  <p class="ld-nogl">This browser couldn’t start 3D graphics (WebGL 2). Try opening the link in Safari or Chrome.</p>
</div>
<script>
(function () {
  function b(s) { if (window.__apBegin && window.__ap && window.__ap.ready) window.__apBegin(s); }
  document.getElementById('go').addEventListener('click', function () { b(true); });
  document.getElementById('goQuiet').addEventListener('click', function () { b(false); });
  window.addEventListener('error', function (e) { if (!window.__ap || !window.__ap.ready) { if (String(e.message || '').indexOf('webgl') >= 0 || !window.WebGL2RenderingContext) document.body.classList.add('nogl'); } });
})();
</script>
